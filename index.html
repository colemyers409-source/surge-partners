<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surge Recruit</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<style>
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side .sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);font-weight:800;margin:14px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.on{color:var(--gold2);background:var(--gold-dim);border-color:rgba(212,175,55,.25)}
.nav .badge{margin-left:auto;background:var(--gold);color:#111;border-radius:999px;font-size:10.5px;padding:1px 7px;font-weight:800}
.main{padding:22px 26px 90px;max-width:1400px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.bottombar{display:none}
.split{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}.split>*{min-width:0}.main{overflow-x:hidden;min-width:0}
.chat-panel{position:sticky;top:20px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.chat-scroll{flex:1;overflow:auto;min-height:200px;max-height:55vh}
.inbox{display:grid;grid-template-columns:340px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);min-height:70vh}
.inbox-list{border-right:1px solid var(--line);overflow:auto;max-height:78vh}
.inbox-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.inbox-item:hover,.inbox-item.on{background:rgba(255,255,255,.035)}
.inbox-item .prev{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .day{background:var(--card2);border:1px solid var(--line);border-radius:10px;min-height:120px;padding:8px}
.cal .day.today{border-color:var(--gold)}
.cal .dn{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.slot{background:var(--gold-dim);border:1px solid rgba(212,175,55,.35);border-radius:8px;padding:6px 8px;font-size:12px;margin-bottom:5px;cursor:pointer}
.slot.nho{background:rgba(90,169,255,.12);border-color:rgba(90,169,255,.35)}
.slot b{display:block}
.mapwrap{position:relative;height:420px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#111}
#map{position:absolute;inset:0}
.mappanel{position:absolute;top:12px;left:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:rgba(18,18,18,.94);border:1px solid var(--line2);border-radius:12px;padding:12px;z-index:500;backdrop-filter:blur(6px)}
.posrow{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}.posrow:hover{background:rgba(255,255,255,.04)}.posrow.on{background:var(--gold-dim);border-color:rgba(212,175,55,.3)}
.leaflet-container{background:#111;font-family:var(--sans)}.leaflet-tooltip{background:#1e1e1e;color:#eee;border-color:#333}
@media(max-width:900px){.mapwrap{height:520px}.mappanel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:45%}}
.mob{display:none}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--gold)}
.bottombar button{position:relative}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,rgba(212,175,55,.18),transparent 60%),var(--bg)}
.login .card{width:100%;max-width:400px;padding:28px}
.score{width:56px;height:56px;border-radius:50%;border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.score.mid{border-color:var(--orange)}.score.low{border-color:var(--red)}
ul.clean{margin:6px 0 0;padding-left:18px}ul.clean li{margin:4px 0}
.demo-banner{background:var(--gold);color:#111;font-weight:700;text-align:center;padding:6px;font-size:12px}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .main{padding:16px 14px 90px}
  .split{grid-template-columns:1fr}.chat-panel{position:static;max-height:none}
  .inbox{grid-template-columns:1fr}.inbox-list{max-height:none;border-right:none}.inbox.threadopen .inbox-list{display:none}.inbox:not(.threadopen) .inbox-thread{display:none}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .bottombar button{background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px}
  .bottombar button.on{color:var(--gold2)}
  .bottombar svg{width:22px;height:22px}
  .cal{grid-template-columns:1fr}.cal .day{min-height:0}
  .desk{display:none}.mob{display:flex}
  .split[style]{grid-template-columns:1fr!important}
  h1{font-size:20px}
  .topbar{flex-wrap:wrap}
  .kv{flex-wrap:wrap}.kv .v{max-width:100%}
  #kpis{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   Surge Recruit — recruiter app
   ========================================================= */
const CFG = window.SR_CONFIG;
const DEMO = new URLSearchParams(location.search).has('demo');
if(!DEMO && typeof supabase==='undefined'){ document.body.innerHTML='<div class="empty">Could not load Supabase client. Check your connection and reload.</div>'; throw new Error('supabase-js failed to load'); }
const sb = DEMO ? null : supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
const fmtTime = d => new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const rel = d => { if(!d) return ''; const ms=Date.now()-new Date(d); const m=Math.floor(ms/6e4); if(m<1) return 'now'; if(m<60) return m+'m'; const h=Math.floor(m/60); if(h<24) return h+'h'; const dd=Math.floor(h/24); return dd<7? dd+'d' : fmtDate(d); };
const ago = d => { const r=rel(d); return /^(\d+[mhd]|now)$/.test(r) ? r+' ago' : r; };
const initials = c => ((c.first_name||'?')[0]+(c.last_name||' ')[0]).toUpperCase().trim();
const fullName = c => [c.first_name,c.last_name].filter(Boolean).join(' ');
const pillClass = s => s==='New'?'s-new': /Qualified/.test(s)?'s-qualified': /Disqualified|Missed|Canceled/.test(s)?'s-bad': /^NHO/.test(s)?'s-nho': /^Interview/.test(s)?'s-interview':'s-closed';
const portalLink = c => location.origin + location.pathname.replace(/index\.html$/,'') + 'c/' + c.token;
let toastT; const toast = m => { let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',2600); };
const fillTpl = (body,c,pos,meeting) => body.replace(/{first_name}/g,c.first_name||'').replace(/{position}/g,pos?.title||'Entry Level Sales Representative').replace(/{portal_link}/g,portalLink(c)).replace(/{meeting_time}/g, meeting? fmtTime(meeting.starts_at):'');

/* ---------------- state ---------------- */
const S = { user:null, member:null, route:'home', params:{}, cache:{}, positions:[], members:[], types:[], templates:[], brand:{} };

/* ---------------- DEMO data (preview without a database) ---------------- */
const demo = (()=>{
  const now=Date.now(), h=36e5, d=24*h;
  const pos=[{id:'p1',title:'Closer - Entry Level',position_type:'Life Insurance Sales Rep',location:'Fayetteville, AR',radius_mi:50,comp_min:85000,comp_max:150000,comp_type:'Commission Only',sales_type:'AE / Closer',licensing:'Life and Health Insurance',work_arrangement:'Hybrid',job_type:'Full Time',seniority:'Entry Level',active:true,hiring_goal:4,lat:36.0626,lng:-94.1574,requirements:'Authorized to work in the US · 18 or older · Driver\'s license · Mobile device',created_at:new Date(now-20*d)},
             {id:'p2',title:'Full Cycle - Entry Level',position_type:'Life Insurance Sales Rep',location:'Fayetteville, AR',radius_mi:50,comp_min:85000,comp_max:150000,comp_type:'Commission Only',sales_type:'Full Cycle',licensing:'No license required',work_arrangement:'Remote',job_type:'Full Time',seniority:'Entry Level',active:true,hiring_goal:4,lat:36.3729,lng:-94.2088,location:'Bentonville, AR',requirements:'Authorized to work in the US · 18 or older · Mobile device · Home internet',created_at:new Date(now-9*d)}];
  const members=[{id:'m1',name:'Cole Myers',email:'cole@surgepartners.com',role:'admin',is_host:true,sms_enabled:true,active:true},{id:'m2',name:'Joey Scariano',email:'joey@surgepartners.com',role:'admin',is_host:true,sms_enabled:true,active:true}];
  const types=[{id:'t1',name:'Interview',duration_min:30,location:'Virtual',capacity:50,booking_window_days:7,cancel_cutoff_min:60,sort:1,join_url:'https://zoom.us/j/000'},{id:'t2',name:'NHO',duration_min:30,location:'Virtual',capacity:1,booking_window_days:7,cancel_cutoff_min:60,sort:2}];
  const names=[['Avery','Collins'],['Jordan','Reyes'],['Taylor','Brooks'],['Morgan','Hale'],['Riley','Nguyen'],['Casey','Whitfield'],['Dakota','Simmons'],['Quinn','Marsh'],['Skyler','Dunn'],['Reese','Calloway'],['Parker','Lowe'],['Emerson','Vale'],['Rowan','Pike'],['Sawyer','Boone'],['Finley','Ash']];
  const st=['New','New','New','Interview Scheduled','Interview Scheduled','Interview Qualified','Interview Missed','New','NHO Scheduled','Disqualified','New','Interview Scheduled','Interview Reschedule','New','NHO Qualified'];
  const refs=[null,'joel',null,'q',null,null,'dylan',null,null,null,'joel',null,null,'q',null];
  const cands=names.map((n,i)=>({id:'c'+i,token:'demo'+i,first_name:n[0],last_name:n[1],email:(n[0]+'.'+n[1]).toLowerCase()+'@example.com',phone:'(479) 555-01'+String(10+i),sms_capable:true,timezone:'America/Chicago',status:st[i],position_id:i%3?'p2':'p1',team:'Surge Partners',assigned_to:i%2?'m2':'m1',referrer:refs[i],referrer_type:refs[i]?'Affiliate':'Direct',source:'apply',ai_score:i%4===0?null:[78,64,91,55,83,72,88,47,69,95,61,77,84,58,90][i],ai_strengths:['Strong customer-service background with several years in high-volume roles','Comfortable on the phone; previous outbound calling experience','Coachable — resume shows steady promotion in prior jobs'],ai_concerns:['No prior life insurance sales experience','Not currently licensed for Life & Health'],notes:'',dnc:i===9,unread:i===1||i===3,last_message_at:new Date(now-(i+1)*3*h),created_at:new Date(now-(i*0.7+0.3)*d),updated_at:new Date(now-i*h)}));
  const msgs=[]; let mid=1;
  cands.forEach((c,i)=>{
    msgs.push({id:mid++,candidate_id:c.id,direction:'out',sender:'ai',body:`Hi ${c.first_name},\n\nThanks for applying for the Entry Level Sales Representative role with Surge Partners. The hiring team will be reviewing your application and will reach out from this number with any updates.\n\nReply STOP to opt out.`,created_at:new Date(c.created_at.getTime()+60e3)});
    if(c.status!=='Disqualified'){ msgs.push({id:mid++,candidate_id:c.id,direction:'out',sender:'ai',body:`Hi ${c.first_name},\n\nGreat news! We've reviewed your application and would love to move forward with the interview process.\n\nThe next step is to schedule a time with the hiring manager: ${location.origin}/c/${c.token}\n\nReply STOP to opt out.`,created_at:new Date(c.created_at.getTime()+3*h)}); }
    if(i===1) msgs.push({id:mid++,candidate_id:c.id,direction:'in',sender:'candidate',body:"Is this a remote position? And do you help with getting licensed?",created_at:new Date(now-3*h)});
    if(i===3) msgs.push({id:mid++,candidate_id:c.id,direction:'in',sender:'candidate',body:"I'll be there at 7pm. Thank you!",created_at:new Date(now-6*h)});
    if(i===6) msgs.push({id:mid++,candidate_id:c.id,direction:'in',sender:'candidate',body:"Sorry, family emergency came up — can I reschedule for later this week?",created_at:new Date(now-20*h)});
    if(i===9) msgs.push({id:mid++,candidate_id:c.id,direction:'in',sender:'candidate',body:"STOP",created_at:new Date(now-30*h)});
  });
  const slots=[]; for(let k=1;k<=10;k++){ const dt=new Date(now+k*d); if(dt.getDay()===0||dt.getDay()===6) continue; dt.setHours(19,0,0,0); slots.push({id:'s'+k,meeting_type_id:'t1',host_name:k%2?'Cole Myers':'Joey Scariano',starts_at:dt,duration_min:30,capacity:50,join_url:'https://zoom.us/j/000'}); if(k%3===0){const n=new Date(dt); n.setHours(18,0,0,0); slots.push({id:'n'+k,meeting_type_id:'t2',host_name:'Joey Scariano',starts_at:n,duration_min:30,capacity:1});} }
  const meetings=[]; cands.forEach((c,i)=>{ if(/Scheduled/.test(c.status)){ const s=slots.find(x=>x.meeting_type_id===(c.status.startsWith('NHO')?'t2':'t1')); meetings.push({id:'mt'+i,candidate_id:c.id,slot_id:s.id,meeting_type_id:s.meeting_type_id,starts_at:s.starts_at,status:'scheduled',created_at:new Date()}); } if(/Qualified|Missed/.test(c.status)){ meetings.push({id:'mq'+i,candidate_id:c.id,slot_id:null,meeting_type_id:'t1',starts_at:new Date(now-2*d),status:/Missed/.test(c.status)?'missed':'qualified',created_at:new Date(now-3*d)}); } });
  const hist=[]; cands.forEach(c=>{ hist.push({id:hist.length+1,candidate_id:c.id,from_status:null,to_status:'New',changed_by:'system',created_at:c.created_at}); if(c.status!=='New') hist.push({id:hist.length+1,candidate_id:c.id,from_status:'New',to_status:c.status,changed_by:'cole@surgepartners.com',created_at:c.updated_at}); });
  const templates=[{key:'applied',label:'Application received',body:'Hi {first_name},\n\nThanks for applying for the {position} role with Surge Partners. The hiring team will be reviewing your application and will reach out from this number with any updates.\n\nReply STOP to opt out.',sort:1},{key:'accepted',label:'Accepted → schedule interview',body:"Hi {first_name},\n\nGreat news! We've reviewed your application for the {position} role and would love to move forward with the interview process.\n\nThe next step is to schedule a time with the hiring manager. You can do that here: {portal_link}\n\nReply STOP to opt out.",sort:2},{key:'rejected',label:'Not moving forward',body:"Hi {first_name}, thanks for applying to Surge Partners. We've reviewed your application for the {position} role, and unfortunately it doesn't quite meet the requirements we're looking for right now.\n\nReply STOP to opt out.",sort:3},{key:'booked',label:'Interview booked confirmation',body:'Hi {first_name},\n\nSurge Partners here. Thanks for scheduling your interview with the hiring manager!\n\nYou can find all the details here: {portal_link}',sort:4},{key:'reminder',label:'Day-of reminder',body:'Hi {first_name},\n\nJust a reminder that our meeting is today at {meeting_time}. You can join here: {portal_link}\n\nLooking forward to connecting!',sort:5},{key:'nudge',label:"Hasn't booked yet",body:"Hey {first_name},\n\nJust wanted to check in about your interview for the {position} role at Surge Partners. I noticed you haven't booked a time yet, and that's totally fine.\n\nWhenever you're ready, you can pick a slot that works for you here: {portal_link}",sort:6},{key:'missed',label:'Missed interview → reschedule',body:"Hi {first_name},\n\nSurge Partners here. We noticed you weren't able to make your interview for the {position} position. We'd still really like to connect with you.\n\nYou can reschedule here: {portal_link}",sort:7},{key:'personal',label:'Personal note from Cole',body:'Hello {first_name}! This is Cole Myers, Co-Founder of Surge Partners. Thanks for applying. I will be personally reviewing your application to ensure we did not overlook a great candidate.',sort:8}];
  const iso=x=>new Date(now+x*d).toISOString().slice(0,10); const orders=[{id:'o1',position_id:'p1',source:'Indeed',starts_on:iso(-19),ends_on:iso(-9),budget:500,spent:500,target_hires:4,standard_conv:11.3,notes:'August sponsored post'},{id:'o2',position_id:'p2',source:'Indeed',starts_on:iso(-9),ends_on:iso(21),budget:750,spent:230,target_hires:4,standard_conv:11.3,notes:''}];
  const clicks=[{ref:'joel'},{ref:'joel'},{ref:'joel'},{ref:'q'},{ref:'q'},{ref:'dylan'},{ref:null},{ref:null},{ref:null},{ref:null},{ref:null},{ref:null}];
  return {pos,members,types,cands,msgs,slots,meetings,hist,templates,clicks,orders,settings:{brand:{company:'Surge Partners',gradient_start:'#0b0b0b',gradient_end:'#c9a227',accent:'#d4af37'},portal:{base_url:'',zoom_url:'https://zoom.us/j/000'},sourcing:{benchmark_cost_per_applicant:19,customer_avg_conv:11.3}}};
})();

/* ---------------- data layer ---------------- */
const uid = () => 'x'+Math.random().toString(36).slice(2,10);
const DB = {
  async loadRefs(){
    if(DEMO){ S.positions=demo.pos; S.members=demo.members; S.types=demo.types; S.templates=demo.templates; S.brand=demo.settings.brand; S.sourcing=demo.settings.sourcing; return; }
    const [p,m,t,tp,st] = await Promise.all([sb.from('rp_positions').select('*').order('created_at'), sb.from('rp_team_members').select('*').order('name'), sb.from('rp_meeting_types').select('*').order('sort'), sb.from('rp_templates').select('*').order('sort'), sb.from('rp_settings').select('*')]);
    S.positions=p.data||[]; S.members=m.data||[]; S.types=t.data||[]; S.templates=tp.data||[]; S.brand=(st.data||[]).find(x=>x.key==='brand')?.value||{}; S.portal=(st.data||[]).find(x=>x.key==='portal')?.value||{}; S.sourcing=(st.data||[]).find(x=>x.key==='sourcing')?.value||{};
  },
  async candidates(){ if(DEMO) return [...demo.cands].sort((a,b)=>b.created_at-a.created_at); const {data,error}=await sb.from('rp_candidates').select('*').order('created_at',{ascending:false}).limit(2000); if(error) throw error; return data; },
  async candidate(id){ if(DEMO) return demo.cands.find(c=>c.id===id); const {data}=await sb.from('rp_candidates').select('*').eq('id',id).single(); return data; },
  async updateCandidate(id,patch){ if(DEMO){ Object.assign(demo.cands.find(c=>c.id===id),patch,{updated_at:new Date()}); if(patch.status) demo.hist.push({id:demo.hist.length+1,candidate_id:id,from_status:'',to_status:patch.status,changed_by:'you',created_at:new Date()}); return; } const {error}=await sb.from('rp_candidates').update(patch).eq('id',id); if(error) throw error; },
  async createCandidate(row){ if(DEMO){ const c={id:uid(),token:uid(),status:'New',created_at:new Date(),updated_at:new Date(),ai_strengths:[],ai_concerns:[],...row}; demo.cands.unshift(c); return c; } const {data,error}=await sb.from('rp_candidates').insert(row).select().single(); if(error) throw error; return data; },
  async messages(cid){ if(DEMO) return demo.msgs.filter(m=>m.candidate_id===cid).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); const {data}=await sb.from('rp_messages').select('*').eq('candidate_id',cid).order('created_at'); return data||[]; },
  async sendMessage(cid,body,sender){ if(DEMO){ const m={id:Date.now(),candidate_id:cid,direction:'out',sender,body,created_at:new Date()}; demo.msgs.push(m); const c=demo.cands.find(x=>x.id===cid); c.last_message_at=m.created_at; return m; } const {data,error}=await sb.from('rp_messages').insert({candidate_id:cid,direction:'out',sender,body}).select().single(); if(error) throw error; return data; },
  async inbox(){ if(DEMO){ return demo.cands.filter(c=>c.last_message_at).sort((a,b)=>new Date(b.last_message_at)-new Date(a.last_message_at)).map(c=>({...c,last:demo.msgs.filter(m=>m.candidate_id===c.id).slice(-1)[0]})); } const {data}=await sb.from('rp_candidates').select('*').not('last_message_at','is',null).order('last_message_at',{ascending:false}).limit(300); const cs=data||[]; const ids=cs.map(c=>c.id); if(!ids.length) return []; const {data:ms}=await sb.from('rp_messages').select('*').in('candidate_id',ids).order('created_at',{ascending:false}); const seen={}; (ms||[]).forEach(m=>{ if(!seen[m.candidate_id]) seen[m.candidate_id]=m; }); return cs.map(c=>({...c,last:seen[c.id]})); },
  async history(cid){ if(DEMO) return demo.hist.filter(h=>h.candidate_id===cid).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)); const {data}=await sb.from('rp_status_history').select('*').eq('candidate_id',cid).order('created_at',{ascending:false}); return data||[]; },
  async meetings(cid){ if(DEMO) return demo.meetings.filter(m=>m.candidate_id===cid).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)); const {data}=await sb.from('rp_meetings').select('*').eq('candidate_id',cid).order('starts_at',{ascending:false}); return data||[]; },
  async allMeetings(from,to){ if(DEMO) return demo.meetings.filter(m=>new Date(m.starts_at)>=from&&new Date(m.starts_at)<to); const {data}=await sb.from('rp_meetings').select('*').gte('starts_at',from.toISOString()).lt('starts_at',to.toISOString()); return data||[]; },
  async updateMeeting(id,patch){ if(DEMO){ Object.assign(demo.meetings.find(m=>m.id===id),patch); return; } const {error}=await sb.from('rp_meetings').update(patch).eq('id',id); if(error) throw error; },

function bindLogin(){
  let mode='in';
  $('#ltoggle').onclick=e=>{e.preventDefault(); mode=mode==='in'?'up':'in'; $('#lt').textContent=mode==='in'?'Sign in':'Create account'; $('#lbtn').textContent=mode==='in'?'Sign in':'Create account'; $('#namef').style.display=mode==='up'?'block':'none'; $('#ltoggle').textContent=mode==='in'?'Need an account? Create one':'Already have an account? Sign in';};
  $('#lbtn').onclick=async()=>{
    const email=$('#em').value.trim(), password=$('#pw').value; $('#lerr').textContent=''; $('#lbtn').disabled=true;
    try{
      let r = mode==='in'? await sb.auth.signInWithPassword({email,password}) : await sb.auth.signUp({email,password,options:{data:{name:$('#nm').value.trim()}}});
      if(r.error) throw r.error;
      if(!r.data.session){ $('#lerr').style.color='var(--green)'; $('#lerr').textContent='Check your email to confirm, then sign in.'; $('#lbtn').disabled=false; return; }
      await afterAuth(r.data.session);
    }catch(e){ $('#lerr').textContent=e.message; $('#lbtn').disabled=false; }
  };
  $('#pw').onkeydown=e=>{ if(e.key==='Enter') $('#lbtn').click(); };
}
async function afterAuth(session){
  S.user=session.user;
  const {data:m}=await sb.rpc('rp_ensure_member'); S.member=m||{name:S.user.email,email:S.user.email};
  if(S.user.user_metadata?.name && S.member && S.member.name!==S.user.user_metadata.name && /@|^[a-z0-9.]+$/i.test(S.member.name)){ await sb.from('rp_team_members').update({name:S.user.user_metadata.name}).eq('id',S.member.id); S.member.name=S.user.user_metadata.name; }
  await DB.loadRefs(); render();
  const nm=S.member?.name||''; if(!nm.includes(' ')||/@/.test(nm)) setTimeout(()=>namePrompt(true),400);
}

    <input class="input" id="q" placeholder="Search name, phone, email…" style="flex:2;min-width:180px" value="${esc(listState.q)}">
    <select class="input" id="fstatus" style="flex:1;min-width:150px"><option value="">All statuses</option>${CFG.STATUSES.map(s=>`<option ${listState.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <select class="input" id="fpos" style="flex:1;min-width:150px"><option value="">All openings</option>${S.positions.map(p=>`<option value="${p.id}" ${listState.pos===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>
    <select class="input" id="fref" style="flex:1;min-width:130px"><option value="">All sources</option>${[...new Set(all.map(c=>c.referrer||'Direct'))].map(r=>`<option ${listState.ref===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
  </div></div>
  <div id="bulk" class="row" style="display:none;margin-bottom:10px"><span class="small muted" id="selcount"></span><select class="input" id="bulkStatus" style="width:auto"><option value="">Change status to…</option>${CFG.STATUSES.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn sm" id="bulkApply">Apply</button></div>
  <div class="card desk" style="padding:0"><div class="table-wrap"><table class="table" id="ctable"></table></div></div><div class="stack mob" id="ccards"></div>`;
  const draw=()=>{
    const q=listState.q.toLowerCase();

    $('#ccards').innerHTML=rows.length?rows.slice(0,200).map(c=>{const p=S.positions.find(p=>p.id===c.position_id);return `<div class="card tight ccard" data-id="${c.id}"><div class="row"><span class="avatar ${c.unread?'gold':''}">${initials(c)}</span><div class="grow" style="min-width:0"><div class="row" style="gap:6px"><b class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(fullName(c))}</b>${c.unread?'<span class="dot"></span>':''}${c.ai_score!=null?`<b class="small" style="color:${c.ai_score>=75?'var(--green)':c.ai_score>=55?'var(--orange)':'var(--red)'}">${c.ai_score}</b>`:''}</div><div class="tiny muted">${esc(p?.title||'—')} · ${esc(c.referrer||'Direct')} · ${rel(c.created_at)}</div></div></div><div class="row" style="margin-top:8px;justify-content:space-between"><span class="pill ${pillClass(c.status)}">${esc(c.status)}</span><span class="row" style="gap:6px">${c.phone?`<a class="btn sm" href="tel:${esc(c.phone)}" onclick="event.stopPropagation()">Call</a>`:''}<a class="btn sm" href="#messaging/${c.id}" onclick="event.stopPropagation()">Text</a></span></div></div>`;}).join(''):'<div class="empty">No candidates match.</div>';
    $('#ccards').querySelectorAll('.ccard').forEach(x=>x.onclick=()=>go('candidate',{id:x.dataset.id}));
    $('#ctable').querySelectorAll('tr.click').forEach(tr=>tr.onclick=e=>{ if(e.target.type==='checkbox') return; go('candidate',{id:tr.dataset.id}); });
    $('#ctable').querySelectorAll('.selc').forEach(cb=>cb.onchange=()=>{ cb.checked?listState.sel.add(cb.dataset.id):listState.sel.delete(cb.dataset.id); bulkUI(); });
    $('#selall').onchange=e=>{ rows.forEach(c=>e.target.checked?listState.sel.add(c.id):listState.sel.delete(c.id)); draw(); bulkUI(); };
  };
  const bulkUI=()=>{ $('#bulk').style.display=listState.sel.size?'flex':'none'; $('#selcount').textContent=listState.sel.size+' selected'; };
  ['q','fstatus','fpos','fref'].forEach(id=>$('#'+id).oninput=()=>{ listState={...listState,q:$('#q').value,status:$('#fstatus').value,pos:$('#fpos').value,ref:$('#fref').value}; draw(); });
  $('#bulkApply').onclick=async()=>{ const s=$('#bulkStatus').value; if(!s) return; for(const id of listState.sel){ await DB.updateCandidate(id,{status:s}); } toast(`Updated ${listState.sel.size} candidates`); listState.sel.clear(); candidatesView(el); };
  $('#exportBtn').onclick=()=>{ const cols=['first_name','last_name','email','phone','status','referrer','ai_score','created_at']; const csv=[cols.join(',')].concat(all.map(c=>cols.map(k=>`"${String(c[k]??'').replace(/"/g,'""')}"`).join(','))).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='candidates.csv'; a.click(); };
  $('#addBtn').onclick=()=>modal(`<h2>Add candidate</h2><div class="grid2" style="margin-top:12px"><div class="field"><label class="f">First name</label><input class="input" id="af"></div><div class="field"><label class="f">Last name</label><input class="input" id="al"></div></div><div class="field"><label class="f">Phone</label><input class="input" id="ap" type="tel"></div><div class="field"><label class="f">Email</label><input class="input" id="ae" type="email"></div><div class="grid2"><div class="field"><label class="f">Opening</label><select class="input" id="apos">${S.positions.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div><div class="field"><label class="f">Source / referrer</label><input class="input" id="ar" placeholder="e.g. Indeed, joel"></div></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="asave">Add</button></div>`,()=>{ $('#asave').onclick=async()=>{ if(!$('#af').value.trim()) return; const c=await DB.createCandidate({first_name:$('#af').value.trim(),last_name:$('#al').value.trim(),phone:$('#ap').value.trim()||null,email:$('#ae').value.trim()||null,position_id:$('#apos').value,referrer:$('#ar').value.trim()||null,referrer_type:$('#ar').value.trim()?'Affiliate':'Direct',source:'manual'}); closeModal(); go('candidate',{id:c.id}); }; });
  draw();
}

/* ---------------- candidate detail ---------------- */
async function candidateView(el){

    <select class="input" id="statusSel" style="width:auto;font-weight:700">${CFG.STATUSES.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`;

  <div style="margin-top:10px"><div class="row" style="margin-bottom:6px"><select class="input" id="tplSel" style="flex:1"><option value="">Insert template…</option>${S.templates.map(t=>`<option value="${t.key}">${esc(t.label)}</option>`).join('')}</select><button class="btn sm" id="copyLink" title="Copy candidate portal link">Copy link</button></div><textarea class="input" id="msgBox" placeholder="Write a message…" ${c.dnc?'disabled':''} style="min-height:70px"></textarea><div class="row" style="justify-content:space-between;margin-top:6px"><span class="tiny muted">${DEMO?'Preview — nothing sends':'Queued to your SMS number (Phase 2 connects Twilio)'}</span><button class="btn primary sm" id="sendBtn" ${c.dnc?'disabled':''}>Send</button></div></div></div></div>`;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $('#statusSel').onchange=async e=>{ await DB.updateCandidate(c.id,{status:e.target.value}); c.status=e.target.value; toast('Status → '+c.status); if(tab==='history') drawTab(); };
  $('#dncBtn').onclick=async()=>{ c.dnc=!c.dnc; await DB.updateCandidate(c.id,{dnc:c.dnc}); candidateView(el); };
  $('#copyLink').onclick=()=>{ navigator.clipboard?.writeText(portalLink(c)); toast('Portal link copied'); };
  $('#tplSel').onchange=e=>{ const t=S.templates.find(t=>t.key===e.target.value); if(t){ $('#msgBox').value=fillTpl(t.body,c,pos); } e.target.value=''; };
  $('#sendBtn').onclick=async()=>{ const b=$('#msgBox').value.trim(); if(!b) return; await DB.sendMessage(c.id,b,S.member?.name||'Surge Partners'); $('#msgBox').value=''; drawThread(); };
  const drawThread=async()=>{ const ms=await DB.messages(c.id); if(c.unread){ await DB.updateCandidate(c.id,{unread:false}); c.unread=false; } $('#thread').innerHTML=`<div class="thread">${ms.length?ms.map(m=>`<div class="msg ${m.direction}">${esc(m.body)}<span class="meta">${m.direction==='in'?esc(fullName(c)):(m.sender==='ai'?'Auto':esc(m.sender))} · ${fmtDT(m.created_at)}${m.direction==='out'&&m.delivery&&m.delivery!=='received'?' · '+m.delivery:''}</span></div>`).join(''):'<div class="empty small">No messages yet.</div>'}</div>`; $('#thread').scrollTop=1e6; };
  drawThread();
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); drawTab(); });
  const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  async function drawTab(){
    const tb=$('#tabbody');
    if(tab==='info'){
      tb.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px"><h3 class="grow">Contact info</h3><button class="btn sm" id="editC">Edit</button></div>${kv('Email',c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—')}${kv('Phone',c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:'—')}${kv('SMS capable',c.sms_capable?'Yes':'No')}${kv('Time zone',esc(c.timezone||'Automatic'))}${kv('Contact status',c.dnc?'<span style="color:var(--red)">Do not contact</span>':'Eligible')}${kv('Portal link',`<a href="${portalLink(c)}" target="_blank" class="small">${esc(portalLink(c).replace(/^https?:\/\//,''))}</a>`)}</div>
      <div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px"><h3 class="grow">Position details</h3></div>${kv('Opening',`<select class="input" id="posSel" style="width:auto;padding:5px 8px"><option value="">—</option>${S.positions.map(p=>`<option value="${p.id}" ${c.position_id===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`)}${kv('Position type',esc(pos?.position_type||'Life Insurance Sales Rep'))}${kv('Team',esc(c.team||CFG.COMPANY))}${kv('Assigned to',`<select class="input" id="ownSel" style="width:auto;padding:5px 8px"><option value="">Unassigned</option>${S.members.map(m=>`<option value="${m.id}" ${c.assigned_to===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`)}${kv('Source',esc(c.source||'apply')+' · '+esc(c.referrer||'Direct'))}</div>
      <div class="card"><h3 style="margin-bottom:8px">Notes</h3><textarea class="input" id="notes" placeholder="Call notes, disposition, anything…">${esc(c.notes||'')}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm primary" id="saveNotes">Save notes</button></div></div>`;
      $('#posSel').onchange=async e=>{ await DB.updateCandidate(c.id,{position_id:e.target.value||null}); c.position_id=e.target.value||null; toast('Opening updated'); };
      $('#ownSel').onchange=async e=>{ await DB.updateCandidate(c.id,{assigned_to:e.target.value||null}); c.assigned_to=e.target.value||null; toast('Assigned'); };
      $('#saveNotes').onclick=async()=>{ await DB.updateCandidate(c.id,{notes:$('#notes').value}); c.notes=$('#notes').value; toast('Notes saved'); };
      $('#editC').onclick=()=>modal(`<h2>Edit contact</h2><div class="grid2" style="margin-top:12px"><div class="field"><label class="f">First</label><input class="input" id="ef" value="${esc(c.first_name)}"></div><div class="field"><label class="f">Last</label><input class="input" id="el" value="${esc(c.last_name||'')}"></div></div><div class="field"><label class="f">Phone</label><input class="input" id="ep" value="${esc(c.phone||'')}"></div><div class="field"><label class="f">Email</label><input class="input" id="ee" value="${esc(c.email||'')}"></div><div class="field"><label class="f">Time zone</label><select class="input" id="etz">${['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu'].map(z=>`<option ${c.timezone===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="esave">Save</button></div>`,()=>{ $('#esave').onclick=async()=>{ const patch={first_name:$('#ef').value.trim(),last_name:$('#el').value.trim(),phone:$('#ep').value.trim()||null,email:$('#ee').value.trim()||null,timezone:$('#etz').value}; await DB.updateCandidate(c.id,patch); Object.assign(c,patch); closeModal(); candidateView(el); }; });
    }
    if(tab==='resume'){
      const url=await DB.resumeUrl(c.resume_path);
      tb.innerHTML=`<div class="card"><div class="row" style="margin-bottom:14px"><h3 class="grow">AI resume analysis</h3>${url?`<a class="btn sm" href="${url}" target="_blank">Open resume</a>`:''}</div>
      ${c.ai_score!=null?`<div class="row" style="margin-bottom:14px"><div class="score ${c.ai_score>=75?'':c.ai_score>=55?'mid':'low'}">${c.ai_score}</div><div><b>Fit score</b><div class="small muted">Scored against the ${esc(pos?.title||'sales rep')} profile</div></div></div>
      <div class="grid2"><div><b style="color:var(--green)">Strengths</b><ul class="clean">${(c.ai_strengths||[]).map(s=>`<li>${esc(s)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div><div><b style="color:var(--orange)">Areas of concern</b><ul class="clean">${(c.ai_concerns||[]).map(s=>`<li>${esc(s)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div></div>${c.ai_summary?`<p class="small muted" style="margin-top:12px">${esc(c.ai_summary)}</p>`:''}`
      :`<div class="empty">${c.resume_path?'Resume uploaded — AI scoring runs in Phase 2 (Claude API edge function).':'No resume on file. Candidates who apply through the form can attach one.'}</div>`}</div>`;
    }
    if(tab==='appts'){
      const ms=await DB.meetings(c.id); const from=new Date(); const to=new Date(Date.now()+30*864e5); const slots=await DB.slots(from,to);
      tb.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:8px"><h3 class="grow">Meetings</h3><button class="btn sm primary" id="bookBtn">Book into a slot</button></div>${ms.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Type</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>${ms.map(m=>{const t=S.types.find(t=>t.id===m.meeting_type_id);return `<tr><td><b>${esc(t?.name||'Meeting')}</b></td><td>${fmtDT(m.starts_at)}</td><td><span class="pill ${m.status==='qualified'?'s-qualified':m.status==='scheduled'?'s-interview':m.status==='completed'?'s-new':'s-bad'}">${m.status}</span></td><td class="row" style="justify-content:flex-end;gap:4px">${m.status==='scheduled'?['qualified','completed','missed','canceled'].map(s=>`<button class="btn sm" data-m="${m.id}" data-s="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join(''):''}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty small">No meetings yet. Book one, or send the portal link so they pick a time.</div>'}</div>`;

      $('#bookBtn').onclick=()=>modal(`<h2>Book ${esc(fullName(c))}</h2><p class="muted small">Pick an open slot in the next 30 days.</p><div class="stack" style="margin-top:10px;max-height:50vh;overflow:auto">${slots.length?slots.map(s=>{const t=S.types.find(t=>t.id===s.meeting_type_id);return `<button class="btn" style="justify-content:space-between" data-slot="${s.id}"><span><b>${esc(t?.name)}</b> · ${fmtDT(s.starts_at)}</span><span class="muted small">${esc(s.host_name||'')}</span></button>`;}).join(''):'<div class="empty">No upcoming slots. Add some on the calendar.</div>'}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>Cancel</button></div>`,()=>{ document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=async()=>{ const s=slots.find(x=>x.id===b.dataset.slot); const t=S.types.find(t=>t.id===s.meeting_type_id); await DB.bookMeeting(c.id,s); await DB.updateCandidate(c.id,{status:t.name+' Scheduled'}); c.status=t.name+' Scheduled'; $('#statusSel').value=c.status; const tpl=S.templates.find(t=>t.key==='booked'); if(tpl) await DB.sendMessage(c.id,fillTpl(tpl.body,c,pos,{starts_at:s.starts_at}),'ai'); closeModal(); toast('Booked'); drawTab(); drawThread(); }); });
    }
    if(tab==='history'){
      const h=await DB.history(c.id);
      tb.innerHTML=`<div class="card"><h3 style="margin-bottom:10px">Change log</h3>${h.length?h.map(x=>`<div class="kv"><span><b>${esc(x.changed_by||'system')}</b> ${x.from_status?`changed status <span class="pill ${pillClass(x.from_status)}">${esc(x.from_status)}</span> → `:'created · '}<span class="pill ${pillClass(x.to_status)}">${esc(x.to_status)}</span></span><span class="small muted">${fmtDT(x.created_at)}</span></div>`).join(''):'<div class="empty small">Nothing yet.</div>'}</div>`;
    }
  }
  drawTab();
}

/* ---------------- messaging inbox ---------------- */
async function messagingView(el){
  const items=await DB.inbox(); S.cache.unread=items.filter(c=>c.unread).length;
  let cur=S.params.id||null; let q=''; if(cur&&!items.find(x=>x.id===cur)){ const c=await DB.candidate(cur); if(c) items.unshift({...c,last:null}); }
  el.innerHTML=`<div class="topbar"><h1>Messaging</h1><span class="small muted">${items.length} threads · ${S.cache.unread} unread</span></div><div class="inbox" id="inbox"><div class="inbox-list"><div style="padding:10px"><input class="input" id="iq" placeholder="Search"></div><div id="ilist"></div></div><div class="inbox-thread" id="ithread"><div class="empty">Select a conversation</div></div></div>`;
  const drawList=()=>{ $('#ilist').innerHTML=items.filter(c=>!q||fullName(c).toLowerCase().includes(q)).map(c=>`<div class="inbox-item ${cur===c.id?'on':''}" data-id="${c.id}"><span class="avatar ${c.unread?'gold':''}">${initials(c)}</span><div style="min-width:0;flex:1"><div class="row" style="justify-content:space-between"><b>${esc(fullName(c))}</b><span class="tiny muted">${rel(c.last_message_at)}</span></div><div class="prev">${c.unread?'<span class="dot" style="margin-right:5px"></span>':''}${esc((c.last?.body||'').replace(/\s+/g,' '))}</div></div></div>`).join('')||'<div class="empty small">No conversations</div>'; $('#ilist').querySelectorAll('.inbox-item').forEach(x=>x.onclick=()=>{cur=x.dataset.id; drawList(); drawThread();}); };
  $('#iq').oninput=e=>{q=e.target.value.toLowerCase(); drawList();};
  const drawThread=async()=>{ const c=items.find(x=>x.id===cur); const box=$('#ithread'); if(!c){ box.innerHTML='<div class="empty">Select a conversation</div>'; return; } $('#inbox').classList.add('threadopen'); const pos=S.positions.find(p=>p.id===c.position_id);

    $('#msend').onclick=async()=>{ const b=$('#mbox').value.trim(); if(!b) return; await DB.sendMessage(c.id,b,S.member?.name||'Surge Partners'); $('#mbox').value=''; c.last={body:b}; c.last_message_at=new Date(); load(); drawList(); };
    load(); };
  drawList(); if(cur) drawThread();
}

/* ---------------- calendar ---------------- */
let calStart = (()=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d; })();

  const from=new Date(calStart), to=new Date(calStart); to.setDate(to.getDate()+7);

  const cands=S.cache.candidates||await DB.candidates(); S.cache.candidates=cands;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(calStart); d.setDate(d.getDate()+i); return d;});
  const today=new Date().toDateString();
  el.innerHTML=`<div class="topbar"><div><h1>Meeting Calendar</h1><div class="small muted">${days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} · ${slots.length} slots · ${meets.filter(m=>m.status==='scheduled').length} booked</div></div><div class="row"><button class="btn sm" id="prev">‹</button><button class="btn sm" id="todayBtn">Today</button><button class="btn sm" id="next">›</button><button class="btn primary" id="addSlot">+ Add slots</button></div></div>
  <div class="cal">${days.map(d=>{const ds=slots.filter(s=>new Date(s.starts_at).toDateString()===d.toDateString());return `<div class="day ${d.toDateString()===today?'today':''}"><div class="dn">${d.toLocaleDateString('en-US',{weekday:'short'})} <span style="color:var(--text);font-size:14px">${d.getDate()}</span></div>${ds.map(s=>{const t=S.types.find(t=>t.id===s.meeting_type_id);const booked=meets.filter(m=>m.slot_id===s.id&&m.status==='scheduled').length;return `<div class="slot ${t?.name==='NHO'?'nho':''}" data-slot="${s.id}"><b>${fmtTime(s.starts_at)} ${esc(t?.name||'')}</b>${booked}/${s.capacity} booked · ${esc(s.host_name||'')}</div>`;}).join('')||'<div class="tiny muted">—</div>'}</div>`;}).join('')}</div>
  <div class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">Scheduling rules</h3><div class="table-wrap"><table class="table"><thead><tr><th>Meeting type</th><th>Duration</th><th>Location</th><th>Default capacity</th><th>Booking window</th><th>Cancel cutoff</th><th>Hosts</th></tr></thead><tbody>${S.types.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${t.duration_min} min</td><td>${esc(t.location||'Virtual')}</td><td>${t.capacity}</td><td>${t.booking_window_days} days</td><td>${t.cancel_cutoff_min} min</td><td class="small">${S.members.filter(m=>m.is_host).map(m=>esc(m.name)).join(', ')}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted" style="margin-top:8px">Edit these under Settings → Meeting types.</p></div>`;
  $('#prev').onclick=()=>{calStart.setDate(calStart.getDate()-7); calendarView(el);}; $('#next').onclick=()=>{calStart.setDate(calStart.getDate()+7); calendarView(el);}; $('#todayBtn').onclick=()=>{calStart=new Date(); calStart.setHours(0,0,0,0); calStart.setDate(calStart.getDate()-calStart.getDay()); calendarView(el);};
  el.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>{ const s=slots.find(z=>z.id===x.dataset.slot); const t=S.types.find(t=>t.id===s.meeting_type_id); const att=meets.filter(m=>m.slot_id===s.id).map(m=>({m,c:cands.find(c=>c.id===m.candidate_id)})).filter(a=>a.c);
    modal(`<h2>${esc(t?.name)} · ${fmtDT(s.starts_at)}</h2><div class="small muted">${esc(s.host_name||'')} · ${s.duration_min} min · capacity ${s.capacity}${s.join_url?` · <a href="${esc(s.join_url)}" target="_blank">Join link</a>`:''}</div><h3 style="margin:14px 0 6px">Attendees (${att.filter(a=>a.m.status==='scheduled').length})</h3>${att.length?att.map(a=>`<div class="kv"><span><a href="#candidate/${a.c.id}" data-close>${esc(fullName(a.c))}</a> <span class="tiny muted">${esc(a.c.phone||'')}</span></span><span class="pill ${a.m.status==='scheduled'?'s-interview':a.m.status==='qualified'?'s-qualified':'s-bad'}">${a.m.status}</span></div>`).join(''):'<div class="empty small">Nobody booked yet.</div>'}<div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn danger sm" id="delSlot">Delete slot</button><button class="btn" data-close>Close</button></div>`,()=>{ $('#delSlot').onclick=async()=>{ if(!confirm('Delete this slot? Booked candidates keep their meeting record.')) return; await DB.deleteSlot(s.id); closeModal(); calendarView(el); }; }); });
  $('#addSlot').onclick=()=>modal(`<h2>Add slots</h2><div class="grid2" style="margin-top:12px"><div class="field"><label class="f">Meeting type</label><select class="input" id="st">${S.types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label class="f">Host</label><select class="input" id="sh">${S.members.filter(m=>m.is_host).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label class="f">Start date</label><input class="input" id="sd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label class="f">Time</label><input class="input" id="stm" type="time" value="19:00"></div></div><div class="grid2"><div class="field"><label class="f">Repeat on</label><div class="row wrap" id="wd">${['S','M','T','W','T','F','S'].map((d,i)=>`<label class="btn sm" style="gap:4px"><input type="checkbox" value="${i}" ${i>0&&i<6?'checked':''}>${d}</label>`).join('')}</div></div><div class="field"><label class="f">For how many weeks</label><input class="input" id="sw" type="number" value="2" min="1" max="12"></div></div><div class="grid2"><div class="field"><label class="f">Capacity</label><input class="input" id="sc" type="number" value="50"></div><div class="field"><label class="f">Join URL (Zoom)</label><input class="input" id="su" placeholder="https://zoom.us/j/…" value="${esc(S.portal?.zoom_url||'')}"></div></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ssave">Create</button></div>`,()=>{
    $('#st').onchange=e=>{ const t=S.types.find(t=>t.id===e.target.value); if(t) $('#sc').value=t.capacity; };
    $('#ssave').onclick=async()=>{ const t=S.types.find(t=>t.id===$('#st').value); const host=S.members.find(m=>m.id===$('#sh').value); const wds=[...document.querySelectorAll('#wd input:checked')].map(i=>+i.value); const [y,mo,da]=$('#sd').value.split('-').map(Number); const [hh,mm]=$('#stm').value.split(':').map(Number); const rows=[]; for(let i=0;i<7*(+$('#sw').value||1);i++){ const d=new Date(y,mo-1,da+i,hh,mm); if(wds.includes(d.getDay())&&d>new Date()) rows.push({meeting_type_id:t.id,host_id:host?.id||null,host_name:host?.name||'',starts_at:d.toISOString(),duration_min:t.duration_min,capacity:+$('#sc').value||t.capacity,join_url:$('#su').value.trim()||null}); } if(!rows.length){ toast('No dates matched'); return; } await DB.createSlots(rows); closeModal(); toast(`Created ${rows.length} slots`); calendarView(el); };
  });
}

/* ---------------- openings (map + ad-spend orders) ---------------- */
const STANDARDS=[['Very lenient',16.9],['Lenient',14.1],['Standard',11.3],['Picky',8.4],['Very picky',5.6]];
const money=n=>'$'+Math.round(n).toLocaleString();
async function geocode(q){ try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}}); const j=await r.json(); if(j[0]) return {lat:+j[0].lat,lng:+j[0].lon}; }catch(e){} return null; }
function orderStats(o,cands){ const from=new Date(o.starts_on+'T00:00:00'), to=new Date(o.ends_on+'T23:59:59'); const cs=cands.filter(c=>(!o.position_id||c.position_id===o.position_id)&&new Date(c.created_at)>=from&&new Date(c.created_at)<=to&&(o.source==='All'||!o.source||(c.referrer||'').toLowerCase()===o.source.toLowerCase()||(o.source==='Indeed'&&!c.referrer))); const a=cs.length, i=cs.filter(c=>/^Interview|^NHO/.test(c.status)).length, h=cs.filter(c=>/Qualified|^NHO/.test(c.status)).length; const spent=+o.spent||+o.budget||0; const conv=a?100*h/a:0; const cpa=a?spent/a:null; const cph=h?spent/h:null; const bench=+(S.sourcing?.benchmark_cost_per_applicant||19); const predCph=bench/((+o.standard_conv||11.3)/100); const rec=predCph*(+o.target_hires||0); const days=Math.max(1,Math.round((to-from)/864e5)); const elapsed=Math.min(days,Math.max(0,Math.round((Date.now()-from)/864e5))); const state=Date.now()<from?'upcoming':Date.now()>to?'expired':'active'; return {a,i,h,conv,cpa,cph,spent,predCph,rec,days,elapsed,state,goalMet:h>=(+o.target_hires||0)}; }
async function openingsView(el){
  const [cands,orders]=await Promise.all([DB.candidates(),DB.orders()]); S.cache.candidates=cands;

  const active=orders.filter(o=>orderStats(o,cands).state==='active').length;
  el.innerHTML=`<div class="topbar"><div><h1>Openings</h1><div class="small muted">${S.positions.filter(p=>p.active).length} active · ${cands.length} applicants · ${active} active ad order${active===1?'':'s'}</div></div><div class="row"><button class="btn" id="newOrder">+ Ad spend order</button><button class="btn primary" id="newPos">+ New opening</button></div></div>
  <div class="mapwrap"><div id="map"></div><div class="mappanel"><div class="small muted" style="font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">Openings on the map</div><div id="poslist"></div></div></div>
  <div id="posdetail" style="margin-top:16px"></div>`;
  const drawList=()=>{ $('#poslist').innerHTML=S.positions.map(p=>{const s=stat(p);return `<div class="posrow ${sel===p.id?'on':''}" data-p="${p.id}"><div class="row"><span class="dot" style="background:${p.active?'var(--gold)':'#555'}"></span><b class="grow">${esc(p.title)}</b><span class="tiny muted">${s.a} appl.</span></div><div class="tiny muted" style="margin-left:18px">${esc(p.location||'—')}${p.radius_mi?' · '+p.radius_mi+' mi':''}${p.lat?'':' · <span style="color:var(--orange)">no pin — edit to set location</span>'}</div></div>`;}).join('')||'<div class="empty small">No openings yet.</div>'; $('#poslist').querySelectorAll('.posrow').forEach(r=>r.onclick=()=>{sel=r.dataset.p; drawList(); drawMap(); drawDetail();}); };
  const drawMap=()=>{ if(!window.L) return; if(!map){ map=L.map('map',{zoomControl:true,attributionControl:false}); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map); } layers.forEach(l=>map.removeLayer(l)); layers=[]; const pts=S.positions.filter(p=>p.lat&&p.lng); pts.forEach(p=>{ const on=p.id===sel; const c=L.circle([p.lat,p.lng],{radius:(p.radius_mi||50)*1609.34,color:on?'#d4af37':'#6b6b6b',weight:on?2:1,fillColor:on?'#d4af37':'#888',fillOpacity:on?.12:.05}).addTo(map); const m=L.circleMarker([p.lat,p.lng],{radius:8,color:'#111',weight:2,fillColor:on?'#f0d264':'#d4af37',fillOpacity:1}).addTo(map).bindTooltip(`<b>${esc(p.title)}</b><br>${esc(p.location||'')} · ${p.radius_mi||50} mi`); m.on('click',()=>{sel=p.id; drawList(); drawMap(); drawDetail();}); layers.push(c,m); }); const cur=pts.find(p=>p.id===sel); if(cur) map.fitBounds(L.latLng(cur.lat,cur.lng).toBounds((cur.radius_mi||50)*1609.34*2),{padding:[20,20]}); else if(pts.length) map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])).pad(0.5),{padding:[20,20]}); else map.setView([36.06,-94.16],9); setTimeout(()=>map.invalidateSize(),50); };
  const drawDetail=()=>{ const p=S.positions.find(x=>x.id===sel); const d=$('#posdetail'); if(!p){ d.innerHTML=''; return; } const s=stat(p); const os=orders.filter(o=>o.position_id===p.id).sort((a,b)=>b.starts_on.localeCompare(a.starts_on)); const latest=os[0];
    const orderCard=o=>{ const st=orderStats(o,cands); const badge=st.state==='active'?'<span class="pill s-new">Active</span>':st.state==='upcoming'?'<span class="pill s-nho">Upcoming</span>':'<span class="pill s-closed">Expired</span>'; const goal=st.goalMet?'<span class="pill s-qualified">Hiring goal met</span>':st.state==='expired'?'<span class="pill s-bad">Hiring goal missed</span>':''; const vs=(v,ref,lowGood)=>v==null?'':(lowGood?(v<=ref?'<span style="color:var(--green)">on track</span>':v<=ref*1.5?'<span style="color:var(--orange)">above</span>':'<span style="color:var(--red)">well above</span>'):(v>=ref?'<span style="color:var(--green)">on track</span>':v>=ref*.6?'<span style="color:var(--orange)">below</span>':'<span style="color:var(--red)">well below</span>'));
      return `<div class="card" style="margin-bottom:12px"><div class="row wrap" style="margin-bottom:10px">${badge}${goal}<span class="small muted">${esc(o.source)} · ${fmtDate(o.starts_on)} – ${fmtDate(o.ends_on)}</span><span class="grow"></span><button class="btn sm" data-eo="${o.id}">Edit</button></div>

    d.innerHTML=`<div class="split" style="grid-template-columns:1fr 1fr"><div class="card"><div class="row" style="margin-bottom:6px"><div class="grow"><h2>${esc(p.title)}${p.active?'':' <span class="pill s-closed">Closed</span>'}</h2><div class="small muted">${esc(p.location||'')}${p.radius_mi?' · '+p.radius_mi+' mi':''} · ${esc(p.position_type)}</div></div><button class="btn sm" data-edit="${p.id}">Edit</button><button class="btn sm primary" data-order="${p.id}">Place an order</button></div>

      <div><div class="small muted" style="font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">${latest?'Most recent order performance':'No ad orders yet'}</div>${latest?orderCard(latest):'<div class="card empty small">Log what you spend on Indeed / ZipRecruiter / Facebook for this opening and this panel shows applicants, cost per hire and conversion vs. your hiring standard — the same numbers SalesDraft shows.</div>'}${os.length>1?`<div class="small muted" style="font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:8px 0">Other orders · ${os.length-1}</div>${os.slice(1).map(o=>{const st=orderStats(o,cands);return `<div class="kv"><span><b>${esc(o.source)}</b> · ${fmtDate(o.starts_on)} – ${fmtDate(o.ends_on)}</span><span class="small">${st.h}/${o.target_hires} hires · ${money(st.spent)} <button class="btn sm" data-eo="${o.id}">Edit</button></span></div>`;}).join('')}`:''}</div></div>`;
    d.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>posForm(p)); d.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>orderForm({position_id:p.id})); d.querySelectorAll('[data-eo]').forEach(b=>b.onclick=()=>orderForm(orders.find(o=>o.id===b.dataset.eo))); d.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy); toast('Apply link copied');}); };
  const posForm=(p={})=>modal(`<h2>${p.id?'Edit':'New'} opening</h2><div class="field" style="margin-top:12px"><label class="f">Title</label><input class="input" id="pt" value="${esc(p.title||'')}" placeholder="Closer - Entry Level"></div><div class="grid2"><div class="field"><label class="f">Advertising location</label><input class="input" id="pl" value="${esc(p.location||'Fayetteville, AR')}" placeholder="City, ST"></div><div class="field"><label class="f">Radius</label><select class="input" id="pr">${[20,35,50,75,100,150,250].map(r=>`<option ${(p.radius_mi||50)===r?'selected':''}>${r}</option>`).join('')}</select></div></div><div class="grid3"><div class="field"><label class="f">Comp min ($/yr)</label><input class="input" id="pmin" type="number" value="${p.comp_min||85000}"></div><div class="field"><label class="f">Comp max</label><input class="input" id="pmax" type="number" value="${p.comp_max||150000}"></div><div class="field"><label class="f">Hiring goal</label><input class="input" id="pg" type="number" value="${p.hiring_goal||4}"></div></div><div class="grid2"><div class="field"><label class="f">Sales type</label><select class="input" id="pst">${['Full Cycle','AE / Closer','Appointment Setter'].map(x=>`<option ${p.sales_type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="f">Licensing</label><select class="input" id="plic">${['No license required','Life and Health Insurance'].map(x=>`<option ${p.licensing===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid3"><div class="field"><label class="f">Work</label><select class="input" id="pw">${['Remote','Hybrid','In-person'].map(x=>`<option ${p.work_arrangement===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="f">Job type</label><select class="input" id="pj">${['Full Time','Part Time'].map(x=>`<option ${p.job_type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="f">Status</label><select class="input" id="pa"><option value="1" ${p.active!==false?'selected':''}>Active</option><option value="0" ${p.active===false?'selected':''}>Closed</option></select></div></div><div class="field"><label class="f">Requirements</label><input class="input" id="preq" value="${esc(p.requirements||'Authorized to work in the US · 18 or older · Mobile device · Home internet')}"></div><div class="field"><label class="f">Description (shown on apply page)</label><textarea class="input" id="pd">${esc(p.description||'')}</textarea></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="psave">Save</button></div>`,()=>{ $('#psave').onclick=async()=>{ if(!$('#pt').value.trim()) return; $('#psave').disabled=true; $('#psave').textContent='Locating…'; const loc=$('#pl').value.trim(); let lat=p.lat, lng=p.lng; if(loc&&(loc!==p.location||!lat)){ const g=await geocode(loc); if(g){lat=g.lat;lng=g.lng;} } const row={title:$('#pt').value.trim(),location:loc,radius_mi:+$('#pr').value,lat,lng,comp_min:+$('#pmin').value||null,comp_max:+$('#pmax').value||null,hiring_goal:+$('#pg').value||4,sales_type:$('#pst').value,licensing:$('#plic').value,work_arrangement:$('#pw').value,job_type:$('#pj').value,active:$('#pa').value==='1',requirements:$('#preq').value,description:$('#pd').value}; if(p.id) row.id=p.id; await DB.savePosition(row); await DB.loadRefs(); closeModal(); toast(lat?'Saved':'Saved — location not found, try "City, ST"'); if(!p.id) sel=S.positions[S.positions.length-1]?.id; openingsView(el); }; });
  const orderForm=(o={})=>{ const isNew=!o.id; o={source:'Indeed',starts_on:new Date().toISOString().slice(0,10),ends_on:new Date(Date.now()+30*864e5).toISOString().slice(0,10),budget:500,spent:0,target_hires:4,standard_conv:11.3,...o}; const bench=+(S.sourcing?.benchmark_cost_per_applicant||19);
    modal(`<h2>${isNew?'Place an ad spend order':'Edit order'}</h2><p class="small muted">Log what you're spending to advertise this opening. Results are counted from applicants who arrive during the dates (matching the source tag).</p><div class="grid2" style="margin-top:12px"><div class="field"><label class="f">Opening</label><select class="input" id="opos">${S.positions.map(p=>`<option value="${p.id}" ${o.position_id===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div><div class="field"><label class="f">Source</label><select class="input" id="osrc">${['Indeed','ZipRecruiter','Facebook','LinkedIn','Craigslist','All','Other'].map(x=>`<option ${o.source===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label class="f">Starts</label><input class="input" id="os" type="date" value="${o.starts_on}"></div><div class="field"><label class="f">Ends</label><input class="input" id="oe" type="date" value="${o.ends_on}"></div></div>
    <div class="field"><label class="f">Hiring standard <span class="muted" style="text-transform:none;font-weight:500">(committed applicant → hire conversion)</span></label><input type="range" id="ostd" min="0" max="4" step="1" value="${Math.max(0,STANDARDS.findIndex(s=>Math.abs(s[1]-o.standard_conv)<0.05))===-1?2:Math.max(0,STANDARDS.findIndex(s=>Math.abs(s[1]-o.standard_conv)<0.05))}" style="width:100%"><div class="row" style="justify-content:space-between" class="tiny">${STANDARDS.map(s=>`<span class="tiny" style="text-align:center"><b>${s[0]}</b><br><span class="muted">${s[1]}%</span></span>`).join('')}</div></div>
    <div class="grid3"><div class="field"><label class="f">Target hires</label><input class="input" id="oth" type="number" value="${o.target_hires}"></div><div class="field"><label class="f">Budget ($)</label><input class="input" id="ob" type="number" value="${o.budget}"></div><div class="field"><label class="f">Spent so far ($)</label><input class="input" id="osp" type="number" value="${o.spent}"></div></div>
    <div class="card tight" style="background:var(--card2);margin-bottom:12px"><div class="row" style="justify-content:space-between"><span class="small muted">Predicted cost / hire</span><b id="ocph"></b></div><div class="row" style="justify-content:space-between"><span class="small muted">Recommended budget for target</span><b id="orec"></b></div><div class="tiny muted" style="margin-top:4px">Based on ${money(bench)} per applicant (Settings → benchmark). Your real Indeed number so far: <b id="oreal">—</b></div></div>
    <div class="field"><label class="f">Notes</label><input class="input" id="on" value="${esc(o.notes||'')}"></div><div class="row" style="justify-content:space-between">${isNew?'<span></span>':'<button class="btn danger sm" id="odel">Delete</button>'}<span><button class="btn" data-close>Cancel</button> <button class="btn primary" id="osave">${isNew?'Place order':'Save'}</button></span></div>`,()=>{
      const real=(()=>{ const os=orders.filter(x=>x.source==='Indeed'); let sp=0,a=0; os.forEach(x=>{const st=orderStats(x,cands); sp+=st.spent; a+=st.a;}); return a?sp/a:null; })(); $('#oreal').textContent=real?money(real)+' / applicant':'no data yet';
      const calc=()=>{ const conv=STANDARDS[+$('#ostd').value][1]; const cph=bench/(conv/100); $('#ocph').textContent=money(cph)+' at '+conv+'%'; $('#orec').textContent=money(cph*(+$('#oth').value||0)); }; $('#ostd').oninput=calc; $('#oth').oninput=calc; calc();
      $('#osave').onclick=async()=>{ const row={position_id:$('#opos').value,source:$('#osrc').value,starts_on:$('#os').value,ends_on:$('#oe').value,budget:+$('#ob').value||0,spent:+$('#osp').value||0,target_hires:+$('#oth').value||0,standard_conv:STANDARDS[+$('#ostd').value][1],notes:$('#on').value}; if(o.id) row.id=o.id; await DB.saveOrder(row); closeModal(); toast('Order saved'); sel=row.position_id; openingsView(el); };
      $('#odel')&&($('#odel').onclick=async()=>{ if(!confirm('Delete this order?')) return; await DB.deleteOrder(o.id); closeModal(); openingsView(el); }); }); };
  $('#newPos').onclick=()=>posForm(); $('#newOrder').onclick=()=>orderForm({position_id:sel});
  drawList(); drawDetail();
  if(window.L) drawMap(); else { const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload=drawMap; document.head.appendChild(s); }
}

/* ---------------- affiliate links ---------------- */
async function affiliateView(el){
  const base=location.origin+location.pathname.replace(/index\.html$/,'')+'apply.html';
  const board=await DB.scoreboard();
  el.innerHTML=`<div class="topbar"><div><h1>Affiliate Links</h1><div class="small muted">Share these. Anyone who applies through a link is credited to that recruiter — even if they apply to a different opening.</div></div></div>
  <div class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:10px"><h3 class="grow">Your links</h3><input class="input" id="refname" style="max-width:220px" placeholder="Recruiter tag (e.g. joel)" value="${esc((S.member?.name||'').split(' ')[0].toLowerCase())}"></div><div class="table-wrap"><table class="table"><thead><tr><th>Opening</th><th>Link</th><th></th></tr></thead><tbody id="links"></tbody></table></div></div>
  <div class="card"><h3 style="margin-bottom:10px">Recruiter scoreboard</h3><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Recruiter</th><th>Clicks</th><th>Applicants</th><th>Interviews</th><th>Qualified</th></tr></thead><tbody>${board.map((r,i)=>`<tr><td class="muted">${i+1}</td><td><b>${esc(r.referrer)}</b></td><td>${r.clicks}</td><td>${r.applicants}</td><td>${r.interviews}</td><td class="gold"><b>${r.qualified}</b></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No data yet</td></tr>'}</tbody></table></div></div>`;
  const draw=()=>{ const ref=encodeURIComponent($('#refname').value.trim()||'direct'); $('#links').innerHTML=[{id:'',title:'Any opening'},...S.positions.filter(p=>p.active)].map(p=>{const u=`${base}?ref=${ref}${p.id?'&pos='+p.id:''}`;return `<tr><td><b>${esc(p.title)}</b></td><td class="small"><a href="${u}" target="_blank">${esc(u.replace(/^https?:\/\//,''))}</a></td><td><button class="btn sm" data-copy="${esc(u)}">Copy</button></td></tr>`;}).join(''); $('#links').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy); toast('Link copied');}); };
  $('#refname').oninput=draw; draw();
}

/* ---------------- settings ---------------- */
async function settingsView(el){
  let tab='brand';
  el.innerHTML=`<div class="topbar"><h1>Settings</h1></div><div class="tabs" id="stabs">${['brand|Branding','templates|Text templates','types|Meeting types','team|Team','setup|Setup & Phase 2'].map(t=>{const[k,l]=t.split('|');return `<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`;}).join('')}</div><div id="sbody"></div>`;
  $('#stabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; $('#stabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); draw();});
  const draw=()=>{ const b=$('#sbody');
    if(tab==='brand'){ const br=S.brand||{}; b.innerHTML=`<div class="card" style="max-width:640px"><h3>Talent page branding</h3><p class="small muted">Used on the candidate portal and apply page.</p><div class="field"><label class="f">Company name</label><input class="input" id="bc" value="${esc(br.company||CFG.COMPANY)}"></div><div class="grid3"><div class="field"><label class="f">Gradient start</label><input class="input" id="b1" type="color" value="${br.gradient_start||'#0b0b0b'}"></div><div class="field"><label class="f">Gradient end</label><input class="input" id="b2" type="color" value="${br.gradient_end||'#c9a227'}"></div><div class="field"><label class="f">Accent</label><input class="input" id="b3" type="color" value="${br.accent||'#d4af37'}"></div></div><div class="field"><label class="f">Benchmark cost per applicant ($) — used for predicted cost / hire</label><input class="input" id="bbench" type="number" value="${S.sourcing?.benchmark_cost_per_applicant||19}"></div><div class="field"><label class="f">Default Zoom / meeting link</label><input class="input" id="bz" value="${esc(S.portal?.zoom_url||'')}" placeholder="https://zoom.us/j/…"></div><div class="gradient-hero" style="--g1:${br.gradient_start||'#0b0b0b'};--g2:${br.gradient_end||'#c9a227'};border-radius:12px;padding:22px;margin-bottom:12px" id="bprev"><div class="logo"><span class="mark">S</span>${esc(br.company||CFG.COMPANY)}</div><h2 style="margin-top:10px">Welcome back, Darion</h2><div class="small">Here's what's next for you.</div></div><button class="btn primary" id="bsave">Save branding</button></div>`;
      ['b1','b2','bc'].forEach(id=>$('#'+id).oninput=()=>{ $('#bprev').style.setProperty('--g1',$('#b1').value); $('#bprev').style.setProperty('--g2',$('#b2').value); });
      $('#bsave').onclick=async()=>{ S.brand={company:$('#bc').value,gradient_start:$('#b1').value,gradient_end:$('#b2').value,accent:$('#b3').value}; await DB.saveSetting('brand',S.brand); S.portal={...(S.portal||{}),zoom_url:$('#bz').value.trim()}; await DB.saveSetting('portal',S.portal); S.sourcing={...(S.sourcing||{}),benchmark_cost_per_applicant:+$('#bbench').value||19}; await DB.saveSetting('sourcing',S.sourcing); toast('Saved'); }; }
    if(tab==='templates'){ b.innerHTML=`<p class="small muted" style="margin-bottom:12px">Placeholders: <code>{first_name}</code> <code>{position}</code> <code>{portal_link}</code> <code>{meeting_time}</code>. "Application received" and "Interview booked" send automatically; the rest are one-click from any thread.</p><div class="grid2">${S.templates.map(t=>`<div class="card"><h3 style="margin-bottom:8px">${esc(t.label)}</h3><textarea class="input" data-k="${t.key}" style="min-height:150px">${esc(t.body)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm primary" data-save="${t.key}">Save</button></div></div>`).join('')}</div>`;
      b.querySelectorAll('[data-save]').forEach(x=>x.onclick=async()=>{ const body=b.querySelector(`[data-k="${x.dataset.save}"]`).value; await DB.saveTemplate(x.dataset.save,body); S.templates.find(t=>t.key===x.dataset.save).body=body; toast('Template saved'); }); }
    if(tab==='types'){ b.innerHTML=`<div class="grid2">${S.types.map(t=>`<div class="card"><h3 style="margin-bottom:8px">${esc(t.name)}</h3><div class="grid2"><div class="field"><label class="f">Duration (min)</label><input class="input" data-t="${t.id}" data-f="duration_min" type="number" value="${t.duration_min}"></div><div class="field"><label class="f">Default capacity</label><input class="input" data-t="${t.id}" data-f="capacity" type="number" value="${t.capacity}"></div><div class="field"><label class="f">Booking window (days)</label><input class="input" data-t="${t.id}" data-f="booking_window_days" type="number" value="${t.booking_window_days}"></div><div class="field"><label class="f">Cancel cutoff (min)</label><input class="input" data-t="${t.id}" data-f="cancel_cutoff_min" type="number" value="${t.cancel_cutoff_min}"></div></div><div class="field"><label class="f">Location</label><input class="input" data-t="${t.id}" data-f="location" value="${esc(t.location||'Virtual')}"></div><div class="field"><label class="f">Join URL</label><input class="input" data-t="${t.id}" data-f="join_url" value="${esc(t.join_url||'')}"></div><div class="row" style="justify-content:flex-end"><button class="btn sm primary" data-savet="${t.id}">Save</button></div></div>`).join('')}</div>`;
      b.querySelectorAll('[data-savet]').forEach(x=>x.onclick=async()=>{ const row={id:x.dataset.savet}; b.querySelectorAll(`[data-t="${x.dataset.savet}"]`).forEach(i=>row[i.dataset.f]=i.type==='number'?+i.value:i.value); await DB.saveType(row); Object.assign(S.types.find(t=>t.id===row.id),row); toast('Saved'); }); }
    if(tab==='team'){ b.innerHTML=`<div class="card"><p class="small muted" style="margin-bottom:10px">Anyone who creates an account on the sign-in page shows up here. Hosts appear as interview options on the calendar.</p><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Host</th><th>Active</th><th></th></tr></thead><tbody>${S.members.map(m=>`<tr><td><input class="input" data-m="${m.id}" data-f="name" value="${esc(m.name)}" style="min-width:140px"></td><td class="small">${esc(m.email||'')}</td><td><select class="input" data-m="${m.id}" data-f="role"><option ${m.role==='admin'?'selected':''}>admin</option><option ${m.role==='recruiter'?'selected':''}>recruiter</option></select></td><td><input type="checkbox" data-m="${m.id}" data-f="is_host" ${m.is_host?'checked':''}></td><td><input type="checkbox" data-m="${m.id}" data-f="active" ${m.active?'checked':''}></td><td><button class="btn sm" data-savem="${m.id}">Save</button></td></tr>`).join('')}</tbody></table></div></div>`;
      b.querySelectorAll('[data-savem]').forEach(x=>x.onclick=async()=>{ const row={id:x.dataset.savem}; b.querySelectorAll(`[data-m="${x.dataset.savem}"]`).forEach(i=>row[i.dataset.f]=i.type==='checkbox'?i.checked:i.value); await DB.saveMember(row); Object.assign(S.members.find(m=>m.id===row.id),row); toast('Saved'); }); }
    if(tab==='setup'){ b.innerHTML=`<div class="card" style="max-width:760px"><h3>Go-live checklist</h3><ol style="padding-left:18px;line-height:1.9"><li>Run <code>schema.sql</code> in Supabase → SQL editor (project szdzbycppkavfwuzlljh). Safe to re-run.</li><li>Supabase → Authentication → Providers → Email: turn off "Confirm email" if you want instant recruiter sign-ins.</li><li>Create your account on the sign-in page. The first account becomes admin.</li><li>Add interview slots on the calendar (7:00 PM weekdays, capacity 50 is the SalesDraft setup).</li><li>Point your ads / Indeed / recruiter links at <code>apply.html?ref=NAME</code>.</li><li>New rows on the old recruiting site (<code>recruits</code> table) mirror in automatically.</li></ol>
      <h3 style="margin-top:18px">Phase 2 — texting + AI</h3><ul style="padding-left:18px;line-height:1.9"><li><b>Outbound SMS:</b> every message you or the sequence sends is queued in <code>rp_outbox</code>. A Supabase Edge Function on a 1-minute cron drains it through Twilio (or SimpleTexting's API) and marks <code>sent</code>.</li><li><b>Inbound SMS:</b> Twilio webhook → Edge Function → <code>rp_inbound_sms(from, body)</code>. STOP auto-flags DNC. Claude then drafts a reply from the thread + your FAQ (licensing help, remote, comp) and it appears here as "Auto".</li><li><b>AI resume scoring:</b> on upload, an Edge Function sends the PDF to Claude and writes <code>ai_score</code>, <code>ai_strengths</code>, <code>ai_concerns</code>.</li><li><b>Reminders:</b> cron sends the "Day-of reminder" template 2 hours before each scheduled meeting and "Missed interview" 30 minutes after a no-show.</li></ul></div>`; }
  };
  draw();
}

/* ---------------- modal ---------------- */
function modal(html,bind){ closeModal(); const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal">${html}</div>`; bg.onclick=e=>{ if(e.target===bg) closeModal(); }; document.body.appendChild(bg); bg.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal())); bind&&bind(); }
function closeModal(){ $('.modal-bg')?.remove(); }

/* ---------------- boot ---------------- */
(async()=>{
  const [r,id]=location.hash.slice(1).split('/'); if(r){ S.route=r; S.params={id}; }
  if(DEMO){ S.user={email:'demo'}; S.member={name:'Cole Myers',email:'cole@surgepartners.com',role:'admin'}; await DB.loadRefs(); render(); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(session) await afterAuth(session); else render();
  sb.auth.onAuthStateChange((ev,sess)=>{ if(ev==='SIGNED_OUT'){ S.user=null; render(); } });
})();
</script>
